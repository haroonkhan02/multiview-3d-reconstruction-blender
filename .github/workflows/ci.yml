name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Tests use synthetic scenes (random points, a rendered textured plane): no dataset,
      # COLMAP, Open3D, Blender or GPU. CPU-only torch runs the plane-sweep test.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy opencv-python-headless matplotlib tqdm pytest ruff
          pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
